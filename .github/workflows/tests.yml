name: Core tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q custom_components tests
      - name: Check Lovelace card JavaScript syntax
        run: node --check custom_components/adaptive_alarm/www/adaptive-alarm-card.js
      - name: Test Lovelace card with Home Assistant-like entities
        run: node tests/test_card_runtime.js
      - name: Run pure-engine tests
        run: python -m unittest discover -s tests -v
