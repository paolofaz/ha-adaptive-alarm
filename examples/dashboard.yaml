# Reusable Adaptive Alarm card for an EXISTING Lovelace YAML dashboard.
# Add this under the existing view's cards: list:
#
#   - type: custom:adaptive-alarm-card
#
# Optional: specify the exact alarm entity and title:
- type: custom:adaptive-alarm-card
  # entity: alarm_control_panel.YOUR_REAL_ENTITY_ID
  title: Antifurto
#
# The module is loaded automatically in resource_mode: storage AND yaml.
# In storage mode the frontend provides a fallback if Resources cannot be updated.
# No lovelace.resources entry is needed in configuration.yaml.
# The card position in the existing dashboard is still chosen by the user.
# This integration never creates dashboards or changes the user's YAML.
